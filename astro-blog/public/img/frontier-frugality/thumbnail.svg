<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="640" height="400" fill="#fafafa"/>
  <!-- descending price bars: Fable, Opus, Sonnet, Haiku (output $/MTok) -->
  <g>
    <rect x="90"  y="70"  width="90" height="240" rx="6" fill="#2563eb"/>
    <rect x="220" y="190" width="90" height="120" rx="6" fill="#9ca3af"/>
    <rect x="350" y="238" width="90" height="72"  rx="6" fill="#b6bcc6"/>
    <rect x="480" y="286" width="90" height="24"  rx="6" fill="#cdd2da"/>
  </g>
  <!-- price labels above bars -->
  <text x="135" y="56"  text-anchor="middle" font-size="24" font-weight="700" fill="#2563eb">$50</text>
  <text x="265" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#6b7280">$25</text>
  <text x="395" y="224" text-anchor="middle" font-size="20" font-weight="700" fill="#6b7280">$15</text>
  <text x="525" y="272" text-anchor="middle" font-size="20" font-weight="700" fill="#6b7280">$5</text>
  <!-- tier labels -->
  <text x="135" y="336" text-anchor="middle" font-size="15" font-weight="600" fill="#374151">Fable</text>
  <text x="265" y="336" text-anchor="middle" font-size="15" fill="#6b7280">Opus</text>
  <text x="395" y="336" text-anchor="middle" font-size="15" fill="#6b7280">Sonnet</text>
  <text x="525" y="336" text-anchor="middle" font-size="15" fill="#6b7280">Haiku</text>
  <!-- baseline -->
  <line x1="70" y1="310" x2="590" y2="310" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="320" y="376" text-anchor="middle" font-size="16" fill="#4b5563">Output price per million tokens, July 2026</text>
</svg>
