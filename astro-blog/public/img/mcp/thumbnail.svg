<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="MCP as a hub connecting many AI apps to many tools">
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- left column: AI apps -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <rect x="24" y="52" width="96" height="34" rx="6"/>
    <rect x="24" y="112" width="96" height="34" rx="6"/>
    <rect x="24" y="172" width="96" height="34" rx="6"/>
    <rect x="24" y="232" width="96" height="34" rx="6"/>
  </g>
  <g fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="72" y="73">IDE</text>
    <text x="72" y="133">Agent</text>
    <text x="72" y="193">Chat app</text>
    <text x="72" y="253">Desktop</text>
  </g>
  <!-- right column: tools/data -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <rect x="360" y="52" width="96" height="34" rx="6"/>
    <rect x="360" y="112" width="96" height="34" rx="6"/>
    <rect x="360" y="172" width="96" height="34" rx="6"/>
    <rect x="360" y="232" width="96" height="34" rx="6"/>
  </g>
  <g fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="408" y="73">GitHub</text>
    <text x="408" y="133">Postgres</text>
    <text x="408" y="193">Slack</text>
    <text x="408" y="253">Files</text>
  </g>
  <!-- connecting lines through hub -->
  <g stroke="#4f46e5" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M120 69 L216 150"/>
    <path d="M120 129 L216 150"/>
    <path d="M120 189 L216 150"/>
    <path d="M120 249 L216 150"/>
    <path d="M264 150 L360 69"/>
    <path d="M264 150 L360 129"/>
    <path d="M264 150 L360 189"/>
    <path d="M264 150 L360 249"/>
  </g>
  <!-- central MCP hub -->
  <rect x="192" y="120" width="96" height="60" rx="10" fill="#4f46e5"/>
  <text x="240" y="147" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">MCP</text>
  <text x="240" y="167" fill="#c7d2fe" font-family="Inter, system-ui, sans-serif" font-size="10" text-anchor="middle">one protocol</text>
  <!-- captions -->
  <text x="72" y="34" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">AI apps</text>
  <text x="408" y="34" fill="#0f172a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tools &amp; data</text>
</svg>
