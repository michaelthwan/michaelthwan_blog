<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Illustrative curve: reasoning accuracy rises roughly log-linearly with the number of thinking tokens spent at test time">
  <rect width="720" height="400" fill="#ffffff"/>

  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1f2937" font-weight="700">Accuracy vs. test-time thinking (schematic)</text>

  <!-- axes -->
  <line x1="80" y1="340" x2="680" y2="340" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="50"  x2="80"  y2="340" stroke="#374151" stroke-width="1.5"/>

  <!-- gridlines -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="80" y1="268" x2="680" y2="268" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="196" x2="680" y2="196" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="124" x2="680" y2="124" stroke="#e5e7eb" stroke-width="1"/>
    <text x="72" y="344" text-anchor="end">low</text>
    <text x="72" y="128" text-anchor="end">high</text>
  </g>

  <!-- log-scale x ticks -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="140" y="360" text-anchor="middle">10&#178;</text>
    <text x="290" y="360" text-anchor="middle">10&#179;</text>
    <text x="440" y="360" text-anchor="middle">10&#8308;</text>
    <text x="590" y="360" text-anchor="middle">10&#8309;</text>
    <text x="380" y="384" text-anchor="middle" fill="#374151">thinking tokens at test time (log scale)</text>
  </g>

  <!-- roughly log-linear rising curve -->
  <polyline fill="none" stroke="#4f46e5" stroke-width="2.8" stroke-linejoin="round"
    points="110,318 180,300 250,276 320,246 390,212 460,178 530,150 600,132 650,124"/>

  <text x="655" y="118" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4338ca" font-weight="700">more thinking &#8594; higher accuracy</text>
  <text x="360" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9ca3af" font-style="italic">shape is illustrative; real curves per benchmark in o1 / R1 reports</text>
</svg>
