<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The RLVR training loop: the policy samples a group of chain-of-thought answers, a verifier scores each, group-relative advantages are computed, and the policy is updated">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Policy box -->
  <rect x="40" y="140" width="150" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="115" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#3730a3" font-weight="700">Policy</text>
  <text x="115" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4338ca">LLM &#960;&#952;</text>

  <!-- Group of sampled CoT answers -->
  <g>
    <rect x="270" y="70" width="180" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="270" y="112" width="180" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="270" y="154" width="180" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <rect x="270" y="196" width="180" height="34" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="360" y="92"  text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">answer o&#8321; (chain of thought)</text>
    <text x="360" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">answer o&#8322; (chain of thought)</text>
    <text x="360" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">answer o&#8323; (chain of thought)</text>
    <text x="360" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">&#8942;</text>
  </g>
  <text x="360" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280" font-style="italic">sample a group of G answers</text>

  <!-- Verifier box -->
  <rect x="530" y="70" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6"/>
  <text x="620" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#065f46" font-weight="700">Verifier</text>
  <text x="620" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">check answer / run tests</text>
  <text x="620" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#047857">reward r&#7522; &#8712; {0, 1}</text>

  <!-- Advantage box -->
  <rect x="530" y="200" width="180" height="80" rx="8" fill="#fafafa" stroke="#374151" stroke-width="1.4"/>
  <text x="620" y="228" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f2937" font-weight="700">Group-relative</text>
  <text x="620" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1f2937" font-weight="700">advantage</text>
  <text x="620" y="268" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4f46e5" font-style="italic">A&#7522; = (r&#7522; &#8722; mean) / std</text>

  <!-- arrows -->
  <line x1="192" y1="180" x2="262" y2="150" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="452" y1="120" x2="522" y2="110" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="620" y1="152" x2="620" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

  <!-- update arrow back to policy -->
  <path d="M530,255 L115,255 L115,224" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  <text x="320" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4338ca" font-weight="700">policy-gradient update: push up A&#7522; &gt; 0, push down A&#7522; &lt; 0</text>

  <!-- title -->
  <text x="380" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#6b7280">RL with verifiable rewards (RLVR) &#183; one GRPO step</text>
</svg>
