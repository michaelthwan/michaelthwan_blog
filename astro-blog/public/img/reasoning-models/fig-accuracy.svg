<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="AIME 2024 pass@1 accuracy of DeepSeek-R1-Zero rising over RL training steps from 15.6% to 71.0%">
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- title -->
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#1f2937" font-weight="700">AIME 2024 accuracy during RL training (R1-Zero)</text>

  <!-- axes -->
  <line x1="80" y1="360" x2="680" y2="360" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="40"  x2="80"  y2="360" stroke="#374151" stroke-width="1.5"/>

  <!-- y gridlines + labels (0, 0.25, 0.5, 0.75, 1.0) -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <line x1="80" y1="360" x2="680" y2="360" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="280" x2="680" y2="280" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="200" x2="680" y2="200" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="120" x2="680" y2="120" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="80" y1="40"  x2="680" y2="40"  stroke="#e5e7eb" stroke-width="1"/>
    <text x="72" y="364" text-anchor="end">0.0</text>
    <text x="72" y="284" text-anchor="end">0.25</text>
    <text x="72" y="204" text-anchor="end">0.50</text>
    <text x="72" y="124" text-anchor="end">0.75</text>
    <text x="72" y="44"  text-anchor="end">1.0</text>
  </g>

  <!-- o1-0912 reference line at 0.744 -->
  <line x1="80" y1="122" x2="680" y2="122" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="676" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700">OpenAI o1-0912 pass@1 = 0.744</text>

  <!-- pass@1 curve (accent indigo) -->
  <polyline fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linejoin="round"
    points="80,309 118,290 155,264 193,248 230,226 268,210 305,194 343,184 380,168 418,162 455,152 493,149 530,142 568,139 605,136 680,133"/>

  <!-- endpoint markers -->
  <circle cx="80"  cy="309" r="4" fill="#4f46e5"/>
  <circle cx="680" cy="133" r="4" fill="#4f46e5"/>
  <text x="92"  y="305" font-family="Arial, sans-serif" font-size="12" fill="#4338ca" font-weight="700">15.6%</text>
  <text x="676" y="152" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4338ca" font-weight="700">71.0% pass@1</text>

  <!-- x labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#6b7280">
    <text x="80"  y="380" text-anchor="middle">0</text>
    <text x="230" y="380" text-anchor="middle">2000</text>
    <text x="380" y="380" text-anchor="middle">4000</text>
    <text x="530" y="380" text-anchor="middle">6000</text>
    <text x="680" y="380" text-anchor="middle">8000</text>
    <text x="380" y="404" text-anchor="middle" fill="#374151">RL training steps</text>
  </g>
</svg>
