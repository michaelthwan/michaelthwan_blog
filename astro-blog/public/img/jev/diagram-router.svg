<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-label="Jev inside an agent system. A request first goes to Jev acting as a router. If its top probability clears the threshold, the tool is called directly. Otherwise the request escalates to a reasoning LLM agent. The LLM's output passes through Jev again as a guardrail before the response is sent.">
  <rect width="780" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="24" y="118" width="110" height="52" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="79" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">user request</text>
  <line x1="134" y1="144" x2="166" y2="144" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Jev router -->
  <rect x="170" y="100" width="150" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="245" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#0969da">Jev as router</text>
  <text x="245" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#0969da">Choice: which tool?</text>
  <text x="245" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#0969da">SQL .96 · Python .02 · ...</text>

  <!-- branch: confident -->
  <path d="M320,122 L370,122 L370,58 L416,58" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="378" y="48" font-family="monospace" font-size="12" fill="#1f2328">p &#8805; &#964;</text>

  <!-- branch: unsure -->
  <path d="M320,166 L370,166 L370,242 L416,242" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="378" y="266" font-family="monospace" font-size="12" fill="#1f2328">p &lt; &#964;</text>

  <!-- tool directly -->
  <rect x="420" y="30" width="150" height="56" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="495" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">call the tool</text>
  <text x="495" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#59636e">fast, near-zero cost</text>

  <!-- LLM -->
  <rect x="420" y="214" width="150" height="56" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="495" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">reasoning LLM agent</text>
  <text x="495" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#59636e">seconds, real cost</text>

  <line x1="570" y1="242" x2="606" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- Jev guardrail -->
  <rect x="610" y="208" width="146" height="68" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="683" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0969da">Jev as guardrail</text>
  <text x="683" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#0969da">Noul: safe to send?</text>

  <!-- response -->
  <rect x="620" y="30" width="126" height="56" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="683" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">response</text>
  <line x1="570" y1="58" x2="616" y2="58" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="683" y1="208" x2="683" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="24" y="308" font-family="Arial, sans-serif" font-size="12.5" fill="#59636e">Jev makes the fast, typed decisions; the LLM does the reasoning and writing. Tool probabilities follow a demo in Krish Naik's video.</text>
</svg>
