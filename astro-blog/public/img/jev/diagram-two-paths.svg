<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" role="img" aria-label="Two ways to get a decision from a model. Both handle the same support ticket. Top: an LLM asked for the category generates text token by token, including any confidence it states, and your code parses it. Bottom: Jev takes the same ticket plus typed questions, the same category question and two extra ones, and returns typed values with a probability distribution for each question, which your code gates on a threshold.">
  <rect width="780" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== Lane A: LLM ===== -->
  <text x="24" y="30" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f2328">LLM: generate text, then parse it</text>

  <rect x="24" y="52" width="130" height="64" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="89" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">ticket text</text>
  <text x="89" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">+ "category?"</text>

  <line x1="154" y1="84" x2="186" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="190" y="52" width="308" height="64" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="344" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#59636e">generated one token at a time</text>
  <g font-family="monospace" font-size="12" fill="#1f2328">
    <rect x="202" y="82" width="66" height="22" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="235" y="97" text-anchor="middle">billing</text>
    <rect x="274" y="82" width="20" height="22" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="284" y="97" text-anchor="middle">,</text>
    <rect x="300" y="82" width="92" height="22" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="346" y="97" text-anchor="middle">confidence</text>
    <rect x="398" y="82" width="20" height="22" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="408" y="97" text-anchor="middle">:</text>
    <rect x="424" y="82" width="18" height="22" rx="4" fill="#fff1e5" stroke="#bc4c00"/><text x="433" y="97" text-anchor="middle" fill="#bc4c00">0</text>
    <rect x="446" y="82" width="18" height="22" rx="4" fill="#fff1e5" stroke="#bc4c00"/><text x="455" y="97" text-anchor="middle" fill="#bc4c00">.</text>
    <rect x="468" y="82" width="18" height="22" rx="4" fill="#fff1e5" stroke="#bc4c00"/><text x="477" y="97" text-anchor="middle" fill="#bc4c00">9</text>
  </g>

  <line x1="498" y1="84" x2="518" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="522" y="52" width="120" height="64" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="582" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">your code</text>
  <text x="582" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">parses it</text>

  <line x1="642" y1="84" x2="670" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="676" y="80" font-family="monospace" font-size="12.5" fill="#1f2328">"billing"</text>
  <text x="676" y="98" font-family="monospace" font-size="12.5" fill="#bc4c00">0.9</text>

  <text x="24" y="146" font-family="Arial, sans-serif" font-size="12.5" fill="#59636e">The 0.9 is written digit by digit like any other text: plausible, not measured. Every output token is billed.</text>

  <line x1="24" y1="172" x2="756" y2="172" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ===== Lane B: Jev ===== -->
  <text x="24" y="204" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f2328">Jev: typed questions in, distributions out</text>

  <rect x="24" y="226" width="130" height="44" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="89" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">same ticket text</text>

  <rect x="24" y="282" width="130" height="118" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="89" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#59636e">questions (schema)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#1f2328">
    <text x="36" y="328"><tspan font-weight="700">Choice</tspan> category?</text>
    <text x="36" y="356"><tspan font-weight="700">Score</tspan> urgency 1-4</text>
    <text x="36" y="384"><tspan font-weight="700">Noul</tspan> wants refund?</text>
  </g>

  <line x1="154" y1="248" x2="196" y2="300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="154" y1="340" x2="196" y2="320" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="200" y="262" width="150" height="96" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="275" y="296" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#0969da">Jev</text>
  <text x="275" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#0969da">all questions answered</text>
  <text x="275" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#0969da">in parallel</text>
  <text x="275" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#59636e">architecture undisclosed</text>

  <line x1="350" y1="310" x2="382" y2="310" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- outputs -->
  <rect x="386" y="222" width="220" height="178" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="496" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#59636e">typed values + probabilities</text>

  <g font-family="Arial, sans-serif" font-size="11.5" fill="#1f2328">
    <text x="398" y="266" font-weight="700">category</text><text x="460" y="266" font-size="10.5" fill="#bc4c00">same question as above</text>
    <text x="398" y="284">billing</text><rect x="460" y="275" width="109" height="11" rx="2" fill="#0969da"/><text x="574" y="284">.84</text>
    <text x="398" y="300">bug</text><rect x="460" y="291" width="20" height="11" rx="2" fill="#0969da" opacity="0.55"/><text x="485" y="300">.16</text>

    <text x="398" y="326" font-weight="700">urgency</text>
    <g>
      <rect x="470" y="330" width="18" height="6" fill="#0969da" opacity="0.55"/>
      <rect x="494" y="316" width="18" height="20" fill="#0969da"/>
      <rect x="518" y="324" width="18" height="12" fill="#0969da" opacity="0.55"/>
      <rect x="542" y="333" width="18" height="3" fill="#0969da" opacity="0.55"/>
      <text x="479" y="348" text-anchor="middle" font-size="10">1</text><text x="503" y="348" text-anchor="middle" font-size="10">2</text><text x="527" y="348" text-anchor="middle" font-size="10">3</text><text x="551" y="348" text-anchor="middle" font-size="10">4</text>
    </g>

    <text x="398" y="376" font-weight="700">refund?</text>
    <text x="460" y="376">P(yes) = 0.12</text>
  </g>

  <line x1="606" y1="310" x2="638" y2="310" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="642" y="262" width="114" height="96" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="699" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#1f2328">your code</text>
  <text x="699" y="310" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1f2328">p &#8805; &#964; : act</text>
  <text x="699" y="330" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#1f2328">else: human</text>

  <text x="24" y="428" font-family="Arial, sans-serif" font-size="12.5" fill="#59636e">Same ticket, same category question. Urgency and refund are extra questions in the same call, at no extra output cost.</text>
  <text x="24" y="448" font-family="Arial, sans-serif" font-size="12.5" fill="#59636e">Every answer is a schema-checked value, never free text. Probabilities shown are illustrative.</text>
</svg>
