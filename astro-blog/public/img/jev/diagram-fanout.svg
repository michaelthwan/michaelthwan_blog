<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-label="Phishing detection in an independent evaluation. Asking Jev one yes-or-no question gave 62.6 percent accuracy versus 81.3 percent for Claude Haiku 4.5. Asking five narrow questions and combining the five probabilities with a logistic regression fitted on 1,000 labelled emails gave 95.0 percent, versus 93.2 percent for Haiku on the same setup. The regression and labels are built and maintained by the user, not by Jev.">
  <rect width="780" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== Path 1: one question ===== -->
  <text x="24" y="30" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f2328">One broad question</text>

  <rect x="24" y="48" width="110" height="52" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="79" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">email</text>
  <line x1="134" y1="74" x2="166" y2="74" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="170" y="48" width="130" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="235" y="79" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0969da">Jev</text>
  <line x1="300" y1="74" x2="332" y2="74" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="336" y="48" width="200" height="52" rx="7" fill="#ffffff" stroke="#d1d9e0"/>
  <text x="436" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">Noul: "Is this phishing?"</text>
  <line x1="536" y1="74" x2="568" y2="74" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <text x="576" y="70" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#bc4c00">62.6%</text>
  <text x="576" y="92" font-family="Arial, sans-serif" font-size="12" fill="#59636e">Haiku 4.5: 81.3%</text>

  <line x1="24" y1="130" x2="756" y2="130" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ===== Path 2: fan-out + regression ===== -->
  <text x="24" y="162" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f2328">Five narrow questions, combined by your own model</text>

  <rect x="24" y="226" width="110" height="52" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="79" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1f2328">email</text>
  <line x1="134" y1="252" x2="166" y2="252" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="170" y="226" width="130" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text x="235" y="257" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#0969da">Jev</text>

  <!-- five questions -->
  <g font-family="Arial, sans-serif" font-size="11.5" fill="#1f2328">
    <line x1="300" y1="252" x2="326" y2="198" stroke="#9ca3af"/>
    <line x1="300" y1="252" x2="326" y2="226" stroke="#9ca3af"/>
    <line x1="300" y1="252" x2="326" y2="254" stroke="#9ca3af"/>
    <line x1="300" y1="252" x2="326" y2="282" stroke="#9ca3af"/>
    <line x1="300" y1="252" x2="326" y2="310" stroke="#9ca3af"/>
    <rect x="328" y="188" width="206" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="336" y="202">links to shorteners / free hosting?</text>
    <rect x="328" y="216" width="206" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="336" y="230">sender uses a free email address?</text>
    <rect x="328" y="244" width="206" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="336" y="258" fill="#59636e">narrow check 3</text>
    <rect x="328" y="272" width="206" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="336" y="286" fill="#59636e">narrow check 4</text>
    <rect x="328" y="300" width="206" height="20" rx="4" fill="#ffffff" stroke="#d1d9e0"/><text x="336" y="314" fill="#59636e">narrow check 5</text>
  </g>
  <text x="431" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#59636e">five P(yes) values, one call</text>

  <line x1="534" y1="254" x2="566" y2="254" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="570" y="222" width="120" height="64" rx="7" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.4"/>
  <text x="630" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="700">logistic</text>
  <text x="630" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#bc4c00" font-weight="700">regression</text>
  <text x="630" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bc4c00">fit on 1,000</text>
  <text x="630" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#bc4c00">labelled emails</text>

  <line x1="690" y1="254" x2="706" y2="254" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="710" y="250" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1a7f37">95.0%</text>
  <text x="710" y="268" font-family="Arial, sans-serif" font-size="10.5" fill="#59636e">Haiku: 93.2%</text>

  <!-- ownership brackets -->
  <path d="M170,356 L170,364 L534,364 L534,356" fill="none" stroke="#0969da" stroke-width="1.4"/>
  <text x="352" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0969da">Jev (one call, output not billed)</text>
  <path d="M570,356 L570,364 L690,364 L690,356" fill="none" stroke="#bc4c00" stroke-width="1.4"/>
  <text x="630" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#bc4c00">yours to build and maintain</text>
</svg>
