<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Log-scale price per million tokens collapsing over time">
  <rect width="640" height="420" fill="#ffffff"/>
  <!-- plot frame -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="60" x2="90" y2="340"/>
    <line x1="90" y1="340" x2="590" y2="340"/>
  </g>
  <!-- log gridlines -->
  <g stroke="#f0f1f3" stroke-width="1">
    <line x1="90" y1="112" x2="590" y2="112"/>
    <line x1="90" y1="168" x2="590" y2="168"/>
    <line x1="90" y1="224" x2="590" y2="224"/>
    <line x1="90" y1="280" x2="590" y2="280"/>
  </g>
  <!-- y axis labels (price per 1M tokens, log) -->
  <g fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end">
    <text x="80" y="65">$100</text>
    <text x="80" y="172">$10</text>
    <text x="80" y="284">$1</text>
    <text x="80" y="344">$0.10</text>
  </g>
  <!-- x axis labels -->
  <g fill="#9aa0a6" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="140" y="362">2023</text>
    <text x="315" y="362">2024</text>
    <text x="565" y="362">2026</text>
  </g>
  <!-- collapsing price curve: GPT-4 class capability, blended $/1M (log positions) -->
  <polyline fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"
    points="140,120 220,168 300,196 360,224 440,286 565,318"/>
  <g fill="#2563eb">
    <circle cx="140" cy="120" r="6"/>
    <circle cx="220" cy="168" r="5"/>
    <circle cx="300" cy="196" r="5"/>
    <circle cx="360" cy="224" r="5"/>
    <circle cx="440" cy="286" r="5"/>
    <circle cx="565" cy="318" r="6"/>
  </g>
  <!-- annotation -->
  <g font-family="Inter, system-ui, sans-serif">
    <text x="150" y="108" fill="#111827" font-size="15" font-weight="700">$36 / M</text>
    <text x="150" y="126" fill="#6b7280" font-size="12">GPT-4, 2023</text>
    <text x="560" y="306" fill="#111827" font-size="15" font-weight="700" text-anchor="end">~$0.4 / M</text>
    <text x="560" y="324" fill="#6b7280" font-size="12" text-anchor="end">same capability, 2026</text>
  </g>
  <!-- title -->
  <text x="90" y="42" fill="#111827" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700">The collapsing price of intelligence</text>
</svg>
